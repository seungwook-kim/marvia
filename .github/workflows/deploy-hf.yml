# Hugging Face Space 배포 (deploy/README.md).
#
# deploy/hf-space/의 Dockerfile · README.md만 Space에 올린다. Dockerfile의 MARVIA_REF를 이번 커밋 SHA로 바꿔 올리므로
# Space가 다시 빌드하면서 그 커밋 코드를 받는다. 레포 변수 HF_SPACE가 없으면 건너뛴다(설정 전 push가 실패하지 않게).
name: Deploy HF Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile에 이번 커밋 SHA 넣기
        run: sed -i "s/^ARG MARVIA_REF=.*/ARG MARVIA_REF=${GITHUB_SHA}/" deploy/hf-space/Dockerfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub
      - name: Space에 올리기
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python -c "
          import os
          from huggingface_hub import upload_folder
          upload_folder(repo_id=os.environ['HF_SPACE'], repo_type='space', folder_path='deploy/hf-space',
                        commit_message='deploy ' + os.environ['GITHUB_SHA'][:7])
          "
