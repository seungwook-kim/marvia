# 무료 배포(SDD 6.8)가 멈추지 않게 받쳐 준다. 일정이 둘이다.
#
# - 12시간마다: Render api의 /health. 평소에는 컨테이너가 10분마다 자기 /health를 불러 깨어 있다(deploy/render/Dockerfile, KEEP_AWAKE).
#   Render가 서비스를 재시작하거나 재우면 그 반복도 멈추므로, 밖에서 한 번 불러 다시 깨운다. 깨어나면 반복도 다시 돈다.
#   10분 간격을 여기서 돌리지 않는 이유: 비공개 레포라 한 번에 1분씩 잡혀 월 4천 분을 넘는다(무료 2천 분).
# - 4일마다: Supabase DB에 직접 select 1. api가 죽어 있어도 DB가 일시정지(무료 요금제 7일)되지 않게 따로 둔다.
#   "*/4"는 매달 1 · 5 · 9 … 29일이라 29일에서 다음 달 1일은 2~3일 간격이다. 어느 경우든 7일 안이다.
#
# API_URL은 레포 변수(예: https://marvia-api.onrender.com), SUPABASE_DB_URL은 세션 풀러 주소(포트 5432) 시크릿이다.
# GitHub 러너는 IPv4만 되어 IPv6 전용인 직접 연결 주소로는 안 붙는다. 수동 실행(workflow_dispatch)은 둘 다 돈다.
name: Keepalive

on:
  schedule:
    - cron: "0 */12 * * *"
    - cron: "30 0 */4 * *"
  workflow_dispatch:

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 잠들어 있으면 깨어나는 데 1분쯤 걸려 첫 요청이 실패할 수 있다. 30초 간격으로 다시 부르고, 끝내 안 되면 실패로 남겨 알림을 받는다
      - name: api /health 부르기
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL 변수가 없다"
            exit 1
          fi
          curl -fsS -m 90 --retry 8 --retry-delay 30 --retry-all-errors "$API_URL/health"

  db:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 */4 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase DB에 쿼리 한 번
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL 시크릿이 없다. 이대로면 DB가 일시정지된다"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -tAc "select 1"
